[package]
name = "libc"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "BORUIX 用户态 C 标准库（Rust 实现 + C ABI，构建于 libsys 之上）"

# 供 no_std bin crate 作为 Rust 依赖链接（rlib），同时产出 C 静态库（staticlib）
# 以便未来原生 C 工具链 / 其他语言经 C ABI 链接（ADR-001：libc = Rust 实现 + C ABI）。
#
# 阶段 5（3P5-2）：`.so` 不在 manifest 里声明 `cdylib`——**cargo 对本自定义目标会丢弃该类型**
# （实测警告 `dropping unsupported crate type`，且加 `dynamic-linking: true` 也不生效）。
# 改为经 `cargo rustc -- --crate-type cdylib` 追加（rustc 会累积多个 --crate-type），
# 见 tools/tools_build/install.py 的 build_cdylib 与 docs/TODO/3p.md 3P5-2。
[lib]
crate-type = ["rlib", "staticlib"]

[features]
# `crt`（默认开）：把 libsys 的进程入口 `_start` 带进来——静态可执行文件需要它。
# 构建 `.so` 时用 `--no-default-features` 关掉：库不该带入口（见 libsys 的同名 feature 说明）。
default = ["crt"]
crt = ["libsys/crt"]

[dependencies]
# default-features = false：crt 由本 crate 的 feature 决定是否开启（见上）。
libsys = { path = "../libsys", default-features = false }
spin = "0.9"

# 用户态裸机库：无 unwinding 运行时。unwind 相关函数由 no_std 下层与
# libsys 提供；libc 自身不引入任何 unwinding 依赖（S35：零外部依赖引入）。
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
opt-level = "z"
lto = true
